name: Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Komponen yang ingin di-build dan push"
        required: true
        type: choice
        options:
          - "all"
          - "frontend"
        default: "all"
  push:
    branches:
      - main

jobs:
  build-frontend:
    name: Build & Push Frontend
    if: ${{ github.event_name == 'push' || github.event.inputs.target == 'all' || github.event.inputs.target == 'frontend' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME || vars.DOCKERHUB_USERNAME || 'bertoale72' }}/solusi-berdigital-frontend:latest
