# ─── Rate Limiting Zones ──────────────────────────────────────────
# Menggunakan prefix unik sb_ agar tidak konflik dengan zone milik konfigurasi lain
limit_req_zone $binary_remote_addr zone=sb_auth_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=sb_api_limit:10m rate=30r/s;
limit_req_status 429;

# ─── HTTP (Port 80) -> Redirect to HTTPS ──────────────────────────
server {
    listen 80;
    server_name solusiberdigital.com www.solusiberdigital.com;

    return 301 https://$host$request_uri;
}

# ─── HTTPS (Port 443) ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name solusiberdigital.com www.solusiberdigital.com;

    # Internal Docker DNS Resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Dynamic Upstream Next.js Fullstack Container
    set $frontend_upstream "http://solusi-berdigital-frontend:3000";

    # SSL Certificate (Sesuaikan path jika menggunakan cert khusus domain ini)
    ssl_certificate /etc/nginx/certs/wildcard.crt;
    ssl_certificate_key /etc/nginx/certs/wildcard.key;

    client_max_body_size 20M;

    # Security: Limit Connection Per-IP
    limit_conn conn_per_ip 50;

    if ($request_method !~ ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$) {
        return 444;
    }

    if ($bad_bot) {
        return 403;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Next.js Static Assets Optimization (Cache 1 tahun immutable)
    location /_next/static/ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Public Assets (Favicon, Gambar statis di /public)
    location ~* \.(?:ico|png|jpg|jpeg|svg|webp|woff2?|ttf|eot)$ {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Backend API Routes (Next.js App Router)
    location /api/ {
        limit_req zone=sb_api_limit burst=20 nodelay;

        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Strict limit khusus login auth admin (/api/auth/login)
        location /api/auth/login {
            limit_req zone=sb_auth_limit burst=3 nodelay;

            proxy_pass $frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Frontend Next.js Main Routing
    location / {
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
